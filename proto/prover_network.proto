syntax = "proto3";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

package prover_network;

service ProverNetwork {
  // register a new application with elf
  rpc RegisterApp(RegisterAppRequest) returns (RegisterAppResponse);

  // estimate gas cost
  rpc EstimateCost(EstimateCostRequest) returns (EstimateCostResponse);

  // add a proving task
  rpc ProveTask(ProveTaskRequest) returns (ProveTaskResponse);

  // add a proving sub-task; generate the intermediate combine phase proof
  rpc ProveSubTask(ProveTaskRequest) returns (ProveTaskResponse);

  // add a proving aggregate-task; generate the final on-chain proof
  rpc ProveAggTask(ProveAggTaskRequest) returns (ProveTaskResponse);

  // try to fetch the proving result if complete
  rpc GetProvingResult(GetProvingResultRequest)
      returns (GetProvingResultResponse);
}

message ErrMsg {
  ErrCode code = 1;
  optional string msg = 2;
}

enum ErrCode {
  OK = 0;
  // invalid arguments
  INVAL = 1;
  // internal error
  INTERNAL = 2;
  // proving in-progress (deprecated)
  PROVING_PENDING = 3;
  // proving failed
  PROVING_FAILED = 4;
  // input exceeds supported maximum emulation cycles
  INPUT_EXCEEDED = 5;
}

message RegisterAppRequest {
  // program elf data
  bytes elf = 1;
  // optional program information
  optional string info = 2;
}

message RegisterAppResponse {
  // common result
  ErrMsg err = 1;
  // application hash
  string app_id = 2;
  // raw bytes of vk digest
  repeated uint32 raw_vk_digest = 3;
}

message EstimateCostRequest {
  // application hash
  string app_id = 1;
  // serialized inputs
  optional bytes inputs = 2;
}

message EstimateCostResponse {
  // common result
  ErrMsg err = 1;
  // gas cost
  uint64 cost = 2;
  // public values digest
  bytes pv_digest = 3;
  // raw bytes of public values digest
  bytes raw_pv_digest = 4;
}

message ProveTaskRequest {
  // application hash
  string app_id = 1;
  // proving task ID, it should be unique for this application
  string task_id = 2;
  // serialized inputs
  optional bytes inputs = 3;
  // use GPU for proving (default: false, use CPU)
  optional bool use_gpu = 4;
}

message ProveTaskResponse {
  // common result
  ErrMsg err = 1;
}

message ProveAggTaskRequest {
  // aggregate application hash
  string app_id = 1;
  // proving task ID, it should be unique for this application
  string task_id = 2;
  // serialized inputs
  optional bytes inputs = 3;
  // sub application inputs
  repeated SubAppInput sub_app_inputs = 4;
  // stage of the proving process
  // it defaults to FINAL (groth16 proof) if unspecified
  ProvingStage stage = 5;
}

message GetProvingResultRequest {
  // application hash
  string app_id = 1;
  // proving task ID, it should be unique for this application
  string task_id = 2;
}

message GetProvingResultResponse {
  // common result
  ErrMsg err = 1;
  // groth16 proof, it's valid if the result code is `OK`
  optional bytes proof = 2;
}

message SubAppInput {
  // sub application ID
  string app_id = 1;
  // sub proof
  bytes proof = 2;
  // sub application raw public values digest
  bytes raw_pv_digest = 3;
}

enum ProvingStage {
  // proving to generate the final groth16 proof; default stage
  FINAL = 0;
  // proving to generate the intermediate combine proof;
  // it could be used to aggregate as a sub-proof
  INTERMEDIATE = 1;
}
